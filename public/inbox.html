<!DOCTYPE html>
<html lang="ru">
<head>
<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script src="/js/toast.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личные сообщения — Chess Home</title>
  <link rel="stylesheet" href="/css/main.css">
  <script src="/js/header/core.js"></script>
  <script src="/js/header/styles.js"></script>
  <script src="/js/header/render.js"></script>
  <script src="/js/header/right.js"></script>
  <script src="/js/header/api.js"></script>
  <link rel="icon" href="/img/logo/favicon.png">
  <style>
    /* ══════════════════════════════════════════════════════════
       INBOX — REDESIGN
       Keeps all existing class names/markup contracts intact;
       only visual language is upgraded (spacing, depth, motion,
       gradients, focus states, scrollbars).
    ══════════════════════════════════════════════════════════ */

    :root {
      --inbox-radius: 18px;
      --inbox-radius-sm: 12px;
      --inbox-shadow-sm: 0 2px 10px rgba(0,0,0,0.18);
      --inbox-shadow-md: 0 10px 30px rgba(0,0,0,0.30);
      --inbox-shadow-glow: 0 0 0 1px rgba(201,168,76,0.25), 0 8px 24px rgba(201,168,76,0.12);
    }

    /* ─── INBOX LAYOUT ─────────────────────────────────────────── */
    .inbox-wrap {
      display: flex;
      height: calc(100vh - var(--header-h));
      margin-top: var(--header-h);
      overflow: hidden;
      background:
        radial-gradient(1200px 500px at 15% -10%, rgba(201,168,76,0.05), transparent 60%),
        var(--bg-primary);
    }

    /* ─── SIDEBAR ──────────────────────────────────────────────── */
    .inbox-sidebar {
      width: 336px;
      min-width: 270px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: var(--bg-secondary);
      flex-shrink: 0;
      position: relative;
    }

    .inbox-sidebar-header {
      padding: 22px 20px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: linear-gradient(180deg, rgba(201,168,76,0.05), transparent);
    }

    .inbox-sidebar-header h2 {
      font-family: var(--font-display);
      font-size: 20px;
      color: var(--accent);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.2px;
    }

    .inbox-search {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 16px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.15);
    }
    .inbox-search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.15), inset 0 1px 2px rgba(0,0,0,0.15);
      background: var(--bg-hover);
    }
    .inbox-search::placeholder { color: var(--text-muted); }

    .inbox-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 8px;
      scrollbar-gutter: stable;
    }

    /* Custom scrollbars — sidebar + messages */
    .inbox-list::-webkit-scrollbar,
    .inbox-messages::-webkit-scrollbar { width: 8px; }
    .inbox-list::-webkit-scrollbar-track,
    .inbox-messages::-webkit-scrollbar-track { background: transparent; }
    .inbox-list::-webkit-scrollbar-thumb,
    .inbox-messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 999px;
    }
    .inbox-list::-webkit-scrollbar-thumb:hover,
    .inbox-messages::-webkit-scrollbar-thumb:hover { background: var(--accent-dark); }

    .inbox-conv-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 12px;
      margin: 0 0 4px;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
      position: relative;
      border-radius: var(--inbox-radius-sm);
      border-left: 3px solid transparent;
    }
    .inbox-conv-item:hover {
      background: var(--bg-hover);
      transform: translateX(2px);
    }
    .inbox-conv-item.active {
      background: var(--bg-card);
      border-left-color: var(--accent);
      box-shadow: var(--inbox-shadow-sm);
    }

    .inbox-conv-avatar {
      width: 46px; height: 46px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: #000;
      flex-shrink: 0;
      position: relative;
      box-shadow: 0 3px 10px rgba(0,0,0,0.25), inset 0 0 0 2px rgba(255,255,255,0.06);
    }

    .inbox-conv-avatar .online-dot-sm {
      position: absolute;
      bottom: 1px; right: 1px;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      border: 2px solid var(--bg-secondary);
    }

    .inbox-conv-info { flex: 1; min-width: 0; }

    .inbox-conv-name {
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }

    .vip-badge-sm { height: 14px; width: auto; vertical-align: -2px; margin-left: 2px; }

    .inbox-conv-preview {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 3px;
    }

    .inbox-conv-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
      flex-shrink: 0;
    }

    .inbox-conv-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    .inbox-unread-badge {
      background: var(--accent);
      color: #000;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      min-width: 18px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(201,168,76,0.4);
    }

    .inbox-empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 70px 24px;
      color: var(--text-muted);
      text-align: center;
    }
    .inbox-empty-state .empty-icon {
      font-size: 48px;
      margin-bottom: 14px;
      opacity: 0.55;
      animation: floatIcon 3.5s ease-in-out infinite;
    }
    .inbox-empty-state p { font-size: 14px; }

    @keyframes floatIcon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* ─── CHAT AREA ────────────────────────────────────────────── */
    .inbox-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background:
        radial-gradient(900px 400px at 100% 0%, rgba(201,168,76,0.04), transparent 55%),
        var(--bg-primary);
    }

    .inbox-chat-header {
      padding: 14px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-secondary);
      backdrop-filter: blur(8px);
      flex-shrink: 0;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
      z-index: 2;
    }

    .inbox-chat-header .chat-user-info { flex: 1; }
    .inbox-chat-header .chat-user-name {
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s;
    }
    .inbox-chat-header .chat-user-name:hover { color: var(--accent); }
    .inbox-chat-header .chat-user-status {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .chat-online-status { color: var(--green); }

    .inbox-chat-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: 10px;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .icon-btn:hover {
      border-color: var(--red);
      color: var(--red);
      background: rgba(224,85,85,0.08);
      transform: translateY(-1px);
    }

    /* ─── MESSAGES ─────────────────────────────────────────────── */
    .inbox-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 26px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .msg-day-divider {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: var(--text-muted);
      margin: 18px 0 12px;
      position: relative;
    }
    .msg-day-divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0; right: 0;
      height: 1px;
      background: var(--border);
      z-index: 0;
    }
    .msg-day-divider span {
      background: var(--bg-primary);
      padding: 4px 14px;
      position: relative;
      z-index: 1;
      border: 1px solid var(--border);
      border-radius: 999px;
    }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      margin-bottom: 3px;
      animation: msgIn 0.25s cubic-bezier(0.2, 0.7, 0.3, 1);
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to   { opacity: 1; transform: none; }
    }
    .msg-row.mine { flex-direction: row-reverse; }

    .msg-avatar-sm {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, var(--bg-hover), var(--bg-card));
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
      flex-shrink: 0; cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
    }
    .msg-avatar-sm:hover { border-color: var(--accent); transform: scale(1.06); }
    .msg-avatar-sm.mine-av {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #000;
      border-color: transparent;
    }

    .msg-bubble {
      max-width: 100%;
      min-width: 120px;
      padding: 10px 15px;
      border-radius: 17px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
      box-shadow: var(--inbox-shadow-sm);
      transition: box-shadow 0.15s;
    }
    .msg-row:hover .msg-bubble { box-shadow: 0 4px 16px rgba(0,0,0,0.24); }

    /* wrap = second child (avatar is first); row-reverse makes it visually right for .mine */
    .msg-row > div + div {
      max-width: min(72%, 600px);
    }
    .msg-row.mine .msg-bubble {
      background: linear-gradient(135deg, #1a2a0e, #1d2f10);
      border-color: rgba(76, 175, 114, 0.3);
      border-bottom-right-radius: 4px;
      border-bottom-left-radius: 17px;
    }

    .msg-time {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 4px;
      text-align: right;
      padding: 0 4px;
    }
    .msg-row:not(.mine) .msg-time { text-align: left; }

    .msg-group { margin-bottom: 10px; }

    /* ─── INPUT ────────────────────────────────────────────────── */
    .inbox-input-area {
      padding: 16px 22px;
      border-top: 1px solid var(--border);
      background: var(--bg-secondary);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    .inbox-text-input {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 11px 18px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 14px;
      outline: none;
      resize: none;
      min-height: 46px;
      max-height: 120px;
      line-height: 1.5;
      transition: border-color 0.2s, box-shadow 0.2s;
      overflow-y: auto;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.18);
    }
    .inbox-text-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.15), inset 0 1px 3px rgba(0,0,0,0.18);
    }
    .inbox-text-input::placeholder { color: var(--text-muted); }

    .send-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #000;
      border: none;
      border-radius: 14px;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
      flex-shrink: 0;
      height: 46px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 12px rgba(201,168,76,0.3);
    }
    .send-btn:hover {
      background: var(--accent-light);
      box-shadow: 0 6px 24px rgba(201,168,76,0.5);
      transform: translateY(-2px) scale(1.03);
    }
    .send-btn:active { transform: translateY(0) scale(0.97); }
    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ─── BLOCKED BAR ──────────────────────────────────────────── */
    .blocked-bar {
      padding: 14px 20px;
      background: rgba(224,85,85,0.08);
      border-top: 1px solid rgba(224,85,85,0.2);
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
      display: none;
    }
    .blocked-bar a {
      color: var(--accent);
      cursor: pointer;
      text-decoration: underline;
    }

    /* ─── WELCOME SCREEN ───────────────────────────────────────── */
    .inbox-welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-align: center;
      padding: 40px;
    }
    .inbox-welcome .welcome-icon {
      font-size: 68px;
      margin-bottom: 22px;
      opacity: 0.35;
      animation: floatIcon 4s ease-in-out infinite;
    }
    .inbox-welcome h3 {
      font-family: var(--font-display);
      font-size: 23px;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }
    .inbox-welcome p { font-size: 14px; max-width: 320px; }

    /* ─── NOTIFICATION BELL ────────────────────────────────────── */
    .inbox-notif-btn {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 5px 12px;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .inbox-notif-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .inbox-notif-btn .notif-count {
      background: var(--red);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 8px;
      min-width: 16px;
      text-align: center;
      display: none;
    }

    /* ─── IN-SITE NOTIFICATION TOAST ──────────────────────────── */
    .dm-notif-toast {
      position: fixed;
      top: 74px;
      right: 20px;
      z-index: 9999;
      background: var(--bg-card);
      border: 1px solid var(--accent);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--inbox-shadow-md), 0 0 0 1px var(--accent-glow);
      max-width: 320px;
      cursor: pointer;
      animation: slideInToast 0.35s cubic-bezier(0.34,1.56,0.64,1);
      transition: opacity 0.3s, transform 0.3s;
    }
    @keyframes slideInToast {
      from { opacity: 0; transform: translateX(30px); }
      to   { opacity: 1; transform: none; }
    }
    .dm-notif-toast .notif-av {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; color: #000; flex-shrink: 0;
    }
    .dm-notif-toast .notif-body { flex: 1; }
    .dm-notif-toast .notif-title { font-weight: 700; font-size: 13px; }
    .dm-notif-toast .notif-preview { font-size: 12px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    .dm-notif-toast .notif-close {
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
      padding: 2px;
      transition: color 0.15s;
    }
    .dm-notif-toast .notif-close:hover { color: var(--text-primary); }

    /* ─── BLOCK CONFIRM MODAL ──────────────────────────────────── */
    .block-modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .block-modal-overlay.open { display: flex; animation: fadeInOverlay 0.2s ease; }
    @keyframes fadeInOverlay { from { opacity: 0; } to { opacity: 1; } }
    .block-modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      max-width: 380px;
      width: 90%;
      text-align: center;
      box-shadow: var(--inbox-shadow-md);
      animation: popInModal 0.25s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes popInModal { from { opacity: 0; transform: scale(0.92) translateY(8px); } to { opacity: 1; transform: none; } }
    .block-modal h3 { font-family: var(--font-display); margin-bottom: 10px; }
    .block-modal p { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }
    .block-modal-actions { display: flex; gap: 10px; justify-content: center; }

    /* ─── LOADING ──────────────────────────────────────────────── */
    .inbox-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      flex-direction: column;
      gap: 12px;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* ─── NOT LOGGED ───────────────────────────────────────────── */
    .not-logged-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--text-muted);
      text-align: center;
      padding: 40px;
    }
    .not-logged-screen .nl-icon { font-size: 64px; opacity: 0.35; animation: floatIcon 4s ease-in-out infinite; }
    .not-logged-screen h3 {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--text-secondary);
    }

    /* ─── MOBILE ───────────────────────────────────────────────── */
    @media (max-width: 680px) {
      .inbox-wrap {
        height: calc(100vh - var(--header-h));
      }
      .inbox-sidebar {
        width: 100%;
        display: none;
      }
      .inbox-sidebar.visible { display: flex; }
      .inbox-chat { display: none; }
      .inbox-chat.visible { display: flex; }
      .back-btn { display: flex !important; }

      .inbox-sidebar-header { padding: 14px 16px 12px; }
      .inbox-sidebar-header h2 { font-size: 17px; margin-bottom: 10px; }
      .inbox-search { font-size: 15px; padding: 10px 14px; }

      .inbox-conv-item { padding: 13px 12px; }
      .inbox-conv-avatar { width: 40px; height: 40px; font-size: 16px; }
      .inbox-conv-name { font-size: 15px; }
      .inbox-conv-preview { font-size: 13px; }

      .inbox-chat-header { padding: 12px 14px; }
      .inbox-chat-header .chat-user-name { font-size: 15px; }

      .inbox-messages { padding: 16px 12px; }
      .msg-bubble { font-size: 15px; padding: 10px 14px; }
      .msg-row > div + div { max-width: min(85%, 600px); }

      .inbox-input-area { padding: 10px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
      .inbox-text-input { font-size: 16px; /* prevents iOS zoom */ }
      .send-btn { padding: 10px 16px; }

      .inbox-chat-actions .icon-btn { padding: 8px; font-size: 16px; }
    }

    /* ─── HAMBURGER NAV ────────────────────────────────────────── */
    .burger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:6px;border:none;background:none;flex-shrink:0}
    .burger span{display:block;width:22px;height:2px;background:var(--text-primary);border-radius:2px;transition:all .25s}
    .burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
    .burger.open span:nth-child(2){opacity:0}
    .burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
    .mobile-nav{display:none;position:fixed;top:var(--header-h);left:0;right:0;background:rgba(14,15,19,.98);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);z-index:999;padding:12px 0;flex-direction:column;gap:2px}
    .mobile-nav.open{display:flex}
    .mobile-nav a{color:var(--text-secondary);padding:12px 24px;font-size:15px;font-weight:600;transition:color .15s,background .15s}
    .mobile-nav a:hover,.mobile-nav a.active{color:var(--accent);background:rgba(201,168,76,.06)}
    @media(max-width:680px){
      .burger{display:flex}
      nav .nav-links{display:none}
    }

    .back-btn {
      display: none;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--accent);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      margin-right: 4px;
      transition: transform 0.15s;
    }
    .back-btn:hover { transform: translateX(-2px); }

    /* ─── LIGHTWEIGHT ANIMATED ICONS ─────────────────────────────
       Inline SVG, animated with transform/opacity only (GPU
       compositable) — no gif files, no network requests, no jank
       even on low-end phones.
    ── */
    .ico { display: inline-block; vertical-align: middle; flex-shrink: 0; }
    .ico-sm { width: 15px; height: 15px; }
    .ico-md { width: 21px; height: 21px; }
    .ico-lg { width: 46px; height: 46px; }
    .ico-xl { width: 60px; height: 60px; }

    @keyframes pingRing {
      0%   { transform: scale(1);   opacity: 0.75; }
      100% { transform: scale(2.6); opacity: 0; }
    }
    .ping-ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: pingRing 2.1s cubic-bezier(0,0,0.2,1) infinite;
    }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0);   opacity: 0.5; }
      30%           { transform: translateY(-2.5px); opacity: 1; }
    }
    .typing-dot {
      transform-box: fill-box;
      transform-origin: center;
      animation: typingBounce 1.3s ease-in-out infinite;
    }
    .typing-dot:nth-child(3) { animation-delay: 0.15s; }
    .typing-dot:nth-child(4) { animation-delay: 0.3s; }

    @keyframes noticePulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.55; }
    }
    .notif-ico { animation: noticePulse 1.6s ease-in-out infinite; }

    .send-btn svg {
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    }
    .send-btn:hover svg { transform: translate(2px,-2px) rotate(-8deg); }
    .send-btn:active svg { transform: translate(4px,-3px) rotate(-12deg) scale(0.92); }

    /* ═══ INBOX v2: ответы, статусы, эмодзи, группировка ═══ */
    .inbox-chat { position: relative; }
    .msg-area { flex: 1; position: relative; min-height: 0; display: flex; flex-direction: column; }
    .msg-area .inbox-messages { flex: 1; }
    .msg-wrap { position: relative; min-width: 0; }
    .msg-row { margin-bottom: 8px; }
    .msg-row.grouped { margin-bottom: 2px; }
    .msg-row.grouped .msg-avatar-sm { visibility: hidden; }
    .bulk .msg-row { animation: none; }
    .msg-bubble a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
    .msg-row.flash .msg-bubble { animation: flashMsg 1.6s ease; }
    @keyframes flashMsg { 0%,55% { box-shadow: 0 0 0 3px rgba(201,168,76,.6); } 100% { box-shadow: var(--inbox-shadow-sm); } }
    .msg-quote { border-left: 3px solid var(--accent); padding: 5px 10px; margin-bottom: 4px; font-size: 12px; border-radius: 8px; background: rgba(127,127,127,.12); cursor: pointer; opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .msg-quote:hover { background: rgba(201,168,76,.14); }
    .msg-tools { position: absolute; top: -16px; display: flex; gap: 2px; padding: 2px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--inbox-shadow-sm); opacity: 0; pointer-events: none; transform: translateY(3px); transition: opacity .15s, transform .15s; z-index: 3; }
    .msg-row:not(.mine) .msg-tools { right: 6px; }
    .msg-row.mine .msg-tools { left: 6px; }
    .msg-row:hover .msg-tools, .msg-row:focus-within .msg-tools, .msg-row.tap .msg-tools { opacity: 1; pointer-events: auto; transform: none; }
    .msg-tools button { background: none; border: 0; color: var(--text-secondary); cursor: pointer; padding: 3px 8px; border-radius: 7px; font: 600 12px var(--font-body); }
    .msg-tools button:hover { background: var(--bg-hover); color: var(--accent); }
    .msg-time { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
    .msg-row:not(.mine) .msg-time { justify-content: flex-start; }
    .msg-status { font-size: 11px; letter-spacing: -2px; color: var(--text-muted); }
    .msg-status.read { color: var(--accent); }
    .msg-status.failed { letter-spacing: 0; color: var(--red); }
    .retry-btn { background: none; border: 0; padding: 0; color: var(--red); font: 600 10px var(--font-body); cursor: pointer; text-decoration: underline; }
    .msg-unread-divider { display: flex; align-items: center; gap: 10px; margin: 14px 0 8px; color: var(--accent); font-size: 11px; font-weight: 700; }
    .msg-unread-divider::before, .msg-unread-divider::after { content: ''; flex: 1; height: 1px; background: rgba(201,168,76,.4); }
    .reply-bar { display: none; align-items: center; gap: 10px; padding: 8px 22px; background: var(--bg-secondary); border-top: 1px solid var(--border); border-left: 3px solid var(--accent); animation: fadeInOverlay .15s; }
    .reply-bar.on { display: flex; }
    .reply-bar-body { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 12px; color: var(--text-muted); }
    .reply-bar-body b { color: var(--accent); }
    .reply-bar-body span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reply-bar button { background: none; border: 0; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 2px 6px; }
    .reply-bar button:hover { color: var(--text-primary); }
    .inbox-input-area { position: relative; }
    .input-wrap { position: relative; flex: 1; display: flex; }
    .input-wrap .inbox-text-input { width: 100%; padding-right: 48px; }
    .char-count { position: absolute; right: 12px; bottom: 7px; font-size: 10px; color: var(--text-muted); pointer-events: none; }
    .char-count.warn { color: var(--red); }
    .tool-btn { width: 46px; height: 46px; flex-shrink: 0; border-radius: 14px; border: 1px solid var(--border); background: var(--bg-card); font-size: 20px; cursor: pointer; transition: border-color .2s, transform .15s; }
    .tool-btn:hover { border-color: var(--accent); transform: scale(1.05); }
    .emoji-pop { position: absolute; bottom: calc(100% + 8px); left: 22px; display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; padding: 8px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--inbox-shadow-md); z-index: 5; animation: popInModal .18s; }
    .emoji-pop[hidden], .to-bottom[hidden] { display: none; }
    .emoji-pop button { background: none; border: 0; font-size: 20px; padding: 5px; border-radius: 8px; cursor: pointer; transition: transform .12s, background .12s; }
    .emoji-pop button:hover { background: var(--bg-hover); transform: scale(1.2); }
    .to-bottom { position: absolute; right: 22px; bottom: 14px; z-index: 4; display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--accent); background: var(--bg-card); color: var(--accent); font: 700 12px var(--font-body); cursor: pointer; box-shadow: var(--inbox-shadow-md); animation: popInModal .2s; }
    .to-bottom #to-bottom-n:not(:empty) { background: var(--accent); color: #000; border-radius: 999px; padding: 0 7px; }
    .typing-txt i { font-style: normal; display: inline-block; animation: typingBounce 1.2s ease-in-out infinite; }
    .typing-txt i:nth-child(2) { animation-delay: .15s; } .typing-txt i:nth-child(3) { animation-delay: .3s; }
    .icon-btn.soft:hover { border-color: var(--accent); color: var(--accent); background: rgba(201,168,76,.08); }
    @media (max-width: 680px) { .reply-bar { padding: 8px 12px; } .emoji-pop { left: 12px; } .to-bottom { right: 12px; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>

<!-- ── HEADER ─────────────────────────────────────────────────── -->
<!-- header injected by /js/header.js -->


<!-- ── INBOX APP ───────────────────────────────────────────────── -->
<div class="inbox-wrap" id="inbox-wrap">

  <!-- SIDEBAR -->
  <div class="inbox-sidebar visible" id="inbox-sidebar">
    <div class="inbox-sidebar-header">
      <h2>
        <svg class="ico ico-md" style="color:var(--accent)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="3"></rect>
          <polyline points="22 6 12 13 2 6"></polyline>
          <circle cx="19" cy="6" r="2.1" fill="var(--accent)" stroke="none"></circle>

        </svg>
        Личные сообщения
      </h2>
      <input class="inbox-search" id="conv-search" placeholder="Поиск по беседам..." oninput="filterConvs(this.value)">
    </div>

<!-- ─── BLOCK CONFIRM MODAL ──────────────────────────────────── -->
<div class="block-modal-overlay" id="block-modal">
  <div class="block-modal">

      <button class="btn btn-ghost btn-sm" onclick="closeBlockModal()">Отмена</button>
      <button class="btn btn-danger btn-sm" id="block-modal-confirm">Заблокировать</button>
    </div>
  </div>
</div>

<!-- Toast container (DM notifications) -->

<!-- ── SCRIPTS ─────────────────────────────────────────────────── -->
<script src="/socket.io/socket.io.js"></script>
<script src="/js/ping-widget.js"></script>
<script>

// ══════════════════════════════════════════════════════════════
//  CHESS HOME — INBOX  (Личные Сообщения)
//  Безопасность: переписку видят только 2 участника + admin
// ══════════════════════════════════════════════════════════════


let socket = null;
let currentUser = null;
// Авторизация теперь через HttpOnly-cookie (ch_token), а не localStorage.
const ADMINS = ['jwvc', 'Marina64']; // owners — имеют доступ ко всем чатам
const SYSTEM_SENDER = 'Система'; // системные сообщения от админа — читать можно, отвечать нельзя
function isSystemPartner(name) { return !!name && name.toLowerCase() === SYSTEM_SENDER.toLowerCase(); }

// ─── ICONS (inline SVG, animated via CSS transform/opacity only —
//      no gif/image requests, so it stays smooth on mobile too) ──
const WARNING_ICON = `<svg class="ico ico-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
  <line x1="12" y1="9" x2="12" y2="13"></line>
  <line x1="12" y1="17" x2="12.01" y2="17"></line>
</svg>`;
const LOCK_ICON = `<svg class="ico ico-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3" y="11" width="18" height="11" rx="2"></rect>
  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
</svg>`;
const MAIL_ICON_XL = `<svg class="ico ico-xl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <rect x="2" y="4" width="20" height="16" rx="3"></rect>
  <polyline points="22 6 12 13 2 6"></polyline>
  <circle cx="19.5" cy="5.5" r="2" fill="var(--accent)" stroke="none"></circle>
  <circle class="ping-ring" cx="19.5" cy="5.5" r="2" fill="none" stroke="var(--accent)" stroke-width="1.2"></circle>
</svg>`;
const CHAT_ICON_SM = `<svg class="ico ico-sm notif-ico" style="margin-right:4px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
</svg>`;
const SEND_ICON = `<svg class="ico ico-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <line x1="22" y1="2" x2="11" y2="13"></line>
  <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
</svg>`;

function toggleMobileNav(){
  const nav=document.getElementById('mobile-nav');
  const btn=document.getElementById('burger-btn');
  nav.classList.toggle('open');
  btn.classList.toggle('open');
}
document.addEventListener('click',e=>{
  if(!e.target.closest('#burger-btn')&&!e.target.closest('#mobile-nav')){
    document.getElementById('mobile-nav')?.classList.remove('open');
    document.getElementById('burger-btn')?.classList.remove('open');
  }
});

// ─── helpers ──────────────────────────────────────────────────
// escapeHtml (P0, унификация): общая реализация в /js/utils.js
// relativeTime/formatTime/formatDay — тоже глобальные, из /js/utils.js
// (2Г, унификация; локальные копии удалены)

// ─── API ──────────────────────────────────────────────────────
// apiGet/apiPost — глобальные, из /js/api.js (2А, унификация).
// X-Device-Id не нужен: сервер читает device id из HttpOnly-cookie.

// ─── STATE ────────────────────────────────────────────────────
let conversations = [];     // [{partner, lastMsg, lastTs, unread, blocked, blockedByPartner}]
let activePartner = null;   // string username
let messages = [];          // array of message objects
let onlineUsers = new Set();// usernames online
let pollingTimer = null;
let convPollingTimer = null;

// ─── TOAST ────────────────────────────────────────────────────
// toast() — глобальная, из /js/toast.js

// ─── DM IN-SITE NOTIFICATION ──────────────────────────────────
function showDmNotif(fromUsername, preview) {
  // Don't show if we're already in that chat
  if (activePartner === fromUsername) return;

  const existing = document.getElementById('dm-notif-' + fromUsername);
  if (existing) existing.remove();

  const el = document.createElement('div');
  el.className = 'dm-notif-toast';
  el.id = 'dm-notif-' + fromUsername;

  el.innerHTML = `
    <div class="notif-av">${fromUsername[0].toUpperCase()}</div>
    <div class="notif-body">
      <div class="notif-title">${CHAT_ICON_SM} Новое сообщение от ${escapeHtml(fromUsername)}</div>
      <div class="notif-preview">${escapeHtml(preview)}</div>
    </div>
    <div class="notif-close" onclick="this.parentElement.remove()">✕</div>
  `;

  el.addEventListener('click', (e) => {
    if (e.target.classList.contains('notif-close')) return;
    el.remove();
    openConversation(fromUsername);
  });

  document.body.appendChild(el);

  setTimeout(() => {
    if (el.isConnected) {
      el.style.opacity = '0';
      el.style.transform = 'translateX(30px)';
      setTimeout(() => el.remove(), 300);
    }
  }, 6000);
}

// ─── AUTH UI ──────────────────────────────────────────────────
function updateAuthUI() {
  const headerRight = document.getElementById('header-right');
  if (!headerRight) return;

  if (currentUser) {
    const isAdmin = currentUser.role === 'admin' || ADMINS.includes(currentUser.username);

    const wrap = document.createElement('div');
    wrap.className = 'user-menu';

    const btn = document.createElement('button');
    btn.className = 'user-btn';
    btn.onclick = toggleUserMenu;
    btn.innerHTML = `
      <div class="player-avatar" style="width:28px;height:28px;font-size:13px">${currentUser.username[0].toUpperCase()}</div>
      <span style="font-size:14px;font-weight:600">${escapeHtml(currentUser.username)}</span>
      <span class="rating-pill">${currentUser.rating}</span>
      ${isAdmin ? '<span style="color:var(--accent);font-size:11px;font-weight:700;margin-left:4px">ADMIN</span>' : ''}
      <span style="color:var(--text-muted);font-size:12px;margin-left:2px">▾</span>`;
    wrap.appendChild(btn);

    const drop = document.createElement('div');
    drop.className = 'user-dropdown';
    drop.id = 'user-dropdown';

    const items = [
      { label: '👤 Мой профиль',       action: () => { window.location = '/profile'; } },
      { label: '✉️ Личные сообщения',  action: () => { window.location = '/inbox'; } },
      { label: '⚙️ Настройки',          action: () => { window.location = '/settings'; } },
    ];
    if (isAdmin) {
      items.push({ label: '🛡 Панель Admin', action: () => { window.location = '/admin'; } });
    }
    items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'dropdown-item';
      el.textContent = item.label;
      el.addEventListener('click', item.action);
      drop.appendChild(el);
    });
    drop.appendChild(document.createElement('hr'));
    const logoutEl = document.createElement('div');
    logoutEl.className = 'dropdown-item danger';
    logoutEl.textContent = '🚪 Выйти';
    logoutEl.addEventListener('click', () => {
      currentUser = null;
      // Серверный логаут очищает HttpOnly-cookie ch_token.
      apiPost('/logout', {}).catch(() => {}).finally(() => { window.location = '/'; });
    });
    drop.appendChild(logoutEl);

    wrap.appendChild(drop);
    headerRight.innerHTML = '';
    headerRight.appendChild(wrap);

  } else {
    headerRight.innerHTML = `
      <button class="btn btn-ghost btn-sm" onclick="window.location='/'">Войти</button>
      <button class="btn btn-primary btn-sm" onclick="window.location='/'">Регистрация</button>`;
  }
}

function toggleUserMenu() { document.getElementById('user-dropdown')?.classList.toggle('open'); }
document.addEventListener('click', e => { if (!e.target.closest('.user-menu')) document.getElementById('user-dropdown')?.classList.remove('open'); });

// ─── SOCKET ───────────────────────────────────────────────────
function connectSocket() {
  if (!currentUser || socket) return;
  // Сокет сам читает HttpOnly-cookie ch_token из заголовков handshake на
  // сервере — withCredentials гарантирует, что cookie доедет до сервера.
  socket = io({ withCredentials: true });
  socket.on('connect', () => socket.emit('auth'));

  socket.on('online_count', count => {
    const el = document.getElementById('online-count');
    if (el) el.textContent = count;
  });

  // Incoming DM via socket
  socket.on('dm_message', (msg) => {
    // msg: { from, to, text, ts, id }
    const isForMe = msg.to === currentUser.username;
    const isMine  = msg.from === currentUser.username;
    if (!isForMe && !isMine) return;

    const partner = isForMe ? msg.from : msg.to;

    // Update conv list
    updateConvLastMsg(partner, msg.text, msg.ts, isForMe);

    // Если это МОЁ сообщение — оно уже отрисовано оптимистично в sendDm().
    // Только добавляем в массив messages[] чтобы polling не дублировал.
    if (isMine) {
      if (!messages.find(m => m.id === msg.id)) {
        messages.push(msg);
      }
      return;
    }

    if (isForMe && (activePartner !== partner || document.hidden)) playPing();
    if (isForMe && activePartner !== partner) {
      showDmNotif(msg.from, msg.text);
      const c = conversations.find(c => c.partner === partner);
      if (c) { c.unread = (c.unread || 0) + 1; renderConvList(); }
    }

    // Чужое сообщение в открытом чате — добавляем
    if (activePartner === partner) {
      // Защита от дубля (на случай гонки с polling)
      if (!messages.find(m => m.id === msg.id)) {
        messages.push(msg);
        appendMessageToChat(msg);
        markRead(partner);
        refreshStatus();
      }
      const c = conversations.find(c => c.partner === partner);
      if (c) c.unread = 0;
      renderConvList();
    }
  });

  socket.on('dm_read', ({ by }) => {
    if (!by || by.toLowerCase() !== (activePartner || '').toLowerCase()) return;
    messages.forEach(m => { if (m.from === currentUser.username && !m.read) { m.read = true; repaintMsg(m); } });
  });

  socket.on('dm_typing', ({ from }) => { if (from && from.toLowerCase() === (activePartner || '').toLowerCase()) showTyping(); });
}

// ─── LOAD CONVERSATIONS ───────────────────────────────────────
async function loadConversations() {
  if (!currentUser) { renderNotLogged(); return; }
  try {
    const data = await apiGet('/dm/conversations');
    conversations = data || [];
    renderConvList();
  } catch (e) {
    document.getElementById('inbox-list').innerHTML =
      `<div class="inbox-empty-state"><div class="empty-icon">${WARNING_ICON}</div><p>${escapeHtml(e.message)}</p></div>`;
  }
}

function updateConvLastMsg(partner, text, ts, incoming) {
  let c = conversations.find(c => c.partner === partner);
  if (c) {
    c.lastMsg = text;
    c.lastTs = ts;
    if (incoming && activePartner !== partner) c.unread = (c.unread || 0) + 1;
  } else {
    conversations.unshift({ partner, lastMsg: text, lastTs: ts, unread: incoming ? 1 : 0 });
  }
  conversations.sort((a, b) => new Date(b.lastTs) - new Date(a.lastTs));
  renderConvList();
}

// ─── RENDER CONV LIST ──────────────────────────────────────────
let convFilter = '';
function filterConvs(q) { convFilter = q.toLowerCase(); renderConvList(); }

function renderConvList() {
  const list = document.getElementById('inbox-list');
  if (!list) return;

  const filtered = conversations.filter(c =>
    !convFilter || c.partner.toLowerCase().includes(convFilter)
  );

  if (!filtered.length) {
    list.innerHTML = `<div class="inbox-empty-state">
      <div class="empty-icon">
        <svg class="ico ico-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>

// ─── OPEN CONVERSATION ────────────────────────────────────────
async function openConversation(partner) {
  if (!currentUser) return;

  // Self-chat guard
  if (partner === currentUser.username) {
    toast('Нельзя переписываться с самим собой', 'error');
    return;
  }

  saveDraft();
  cancelDmReply();
  activePartner = partner;
  renderConvList(); // highlight active

  const chatArea = document.getElementById('inbox-chat');

  // Mobile
  document.getElementById('inbox-sidebar')?.classList.remove('visible');
  chatArea.classList.add('visible');

  // Loading state
  chatArea.innerHTML = `
    <div class="inbox-chat-header">
      <button class="back-btn" onclick="mobileBack()">← Назад</button>
      <div class="inbox-conv-avatar" style="width:40px;height:40px;font-size:16px">${escapeHtml(partner[0].toUpperCase())}</div>
      <div class="chat-user-info">

      </div>

    <div class="inbox-loading"><div class="spinner" style="margin:0 auto"></div> Загрузка сообщений...</div>`;

  try {
    const data = await apiGet('/dm/messages/' + encodeURIComponent(partner));
    messages = data.messages || [];
    const conv = conversations.find(c => c.partner === partner) || {};
    window._unreadBefore = conv.unread || 0;
    conv.unread = 0;
    // На случай новой переписки, которой ещё не было в списке диалогов —
    // берём актуальный VIP-статус собеседника прямо из ответа /dm/messages.
    conv.vip = !!data.partnerVip;

    // Mark as read

  } catch (e) {

      <div class="welcome-icon">${WARNING_ICON}</div>
      <h3>Ошибка</h3>
      <p>${escapeHtml(e.message)}</p>

  }

  clearInterval(pollingTimer);
  pollingTimer = setInterval(() => { if (!document.hidden) pollMessages(partner); }, 4000);

const _el = id => document.getElementById(id);
let _replyToMsg = null, _newCount = 0;

// ─── helpers ──────────────────────────────────────────────────
function avHue(n) { let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function avStyle(n) {
  if (!n || isSystemPartner(n)) return '';
  const h = avHue(n);
  return `background:linear-gradient(135deg,hsl(${h} 55% 52%),hsl(${(h + 30) % 360} 55% 38%));color:#fff;`;
}
function linkify(t) {
  return escapeHtml(t).replace(/(https?:\/\/[^\s<"']+[^\s<"'.,;:!?)\]])/g,
    '<a href="$1" target="_blank" rel="noopener noreferrer nofollow">$1</a>');
}
const isTemp = m => String(m.id).startsWith('temp_');

// ─── ОДНА функция рисует сообщение (раньше было 2 копии, и в «живой» копии
//     не было ни кнопки «Ответить», ни цитаты — отсюда баг с перезагрузкой) ─
function buildMsgRow(msg, prev) {
  // страховка: если replyTo пришёл голым id — собираем цитату из загруженных сообщений
  if (typeof msg.replyTo === 'string') {
    const o = messages.find(m => m.id === msg.replyTo);
    msg.replyTo = o ? { id: o.id, from: o.from, text: o.text } : null;
  }
  const mine = msg.from === currentUser.username;
  const sys = isSystemPartner(msg.from);
  const grouped = prev && prev.from === msg.from && formatDay(prev.ts) === formatDay(msg.ts)
    && (new Date(msg.ts) - new Date(prev.ts)) < 5 * 60000;

  const row = document.createElement('div');
  row.className = 'msg-row' + (mine ? ' mine' : '') + (grouped ? ' grouped' : '');
  row.id = 'msg-' + msg.id;

  const av = document.createElement('div');
  av.className = 'msg-avatar-sm' + (mine ? ' mine-av' : '');
  av.textContent = sys ? '📢' : msg.from[0].toUpperCase();
  av.title = msg.from;
  if (!mine && !sys) av.style.cssText = avStyle(msg.from);

  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap';

  if (msg.replyTo) {
    const q = document.createElement('div');
    q.className = 'msg-quote';
    q.innerHTML = '<b>' + escapeHtml(msg.replyTo.from) + '</b> · ' + escapeHtml(String(msg.replyTo.text).slice(0, 80));
    q.title = msg.replyTo.text;
    q.onclick = () => {
      const t = _el('msg-' + msg.replyTo.id);
      if (!t) return toast('Исходное сообщение выше в истории', 'error');
      t.scrollIntoView({ behavior: 'smooth', block: 'center' });
      t.classList.add('flash'); setTimeout(() => t.classList.remove('flash'), 1700);
    };
    wrap.appendChild(q);
  }

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = linkify(msg.text);
  wrap.appendChild(bubble);

  const tools = document.createElement('div');
  tools.className = 'msg-tools';
  if (!sys) {
    const r = document.createElement('button');
    r.type = 'button'; r.textContent = '↩ Ответить'; r.onclick = () => startDmReply(msg);
    tools.appendChild(r);
    bubble.ondblclick = () => startDmReply(msg);
  }
  const c = document.createElement('button');
  c.type = 'button'; c.textContent = 'Копировать';
  c.onclick = () => navigator.clipboard?.writeText(msg.text).then(() => toast('Скопировано', 'success'));
  tools.appendChild(c);
  wrap.appendChild(tools);
  bubble.addEventListener('click', () => { if (matchMedia('(hover:none)').matches) row.classList.toggle('tap'); });

  const time = document.createElement('div');
  time.className = 'msg-time';
  time.innerHTML = '<span>' + formatTime(msg.ts) + '</span><span class="msg-status"></span>';
  wrap.appendChild(time);

  row.appendChild(av); row.appendChild(wrap);
  paintStatus(row, msg);
  return row;
}

function paintStatus(row, msg) {
  const el = row.querySelector('.msg-status');
  if (!el || msg.from !== currentUser.username) return;
  if (msg._state === 'failed') {
    el.className = 'msg-status failed';
    el.innerHTML = '<button type="button" class="retry-btn">Не отправлено · повторить</button>';
    el.firstChild.onclick = () => sendDm(msg);
  } else if (msg._state === 'sending') {
    el.className = 'msg-status'; el.textContent = '…'; el.title = 'Отправляется';
  } else {
    el.className = 'msg-status' + (msg.read ? ' read' : '');
    el.textContent = msg.read ? '✓✓' : '✓';
    el.title = msg.read ? 'Прочитано' : 'Доставлено';
  }
}
function repaintMsg(msg) { const r = _el('msg-' + msg.id); if (r) paintStatus(r, msg); }

function renderMessages() {
  const list = _el('msg-list');
  if (!list) return;
  list.innerHTML = '';
  list.classList.add('bulk');
  const unreadFrom = (window._unreadBefore || 0) > 0 ? messages.length - window._unreadBefore : -1;
  let lastDay = '';
  messages.forEach((msg, i) => {
    const day = formatDay(msg.ts);
    if (day !== lastDay) {
      const d = document.createElement('div');
      d.className = 'msg-day-divider'; d.innerHTML = `<span>${day}</span>`;
      list.appendChild(d); lastDay = day;
    }
    if (i === unreadFrom) {
      const u = document.createElement('div');
      u.className = 'msg-unread-divider'; u.textContent = 'Новые сообщения';
      list.appendChild(u);
    }
    list.appendChild(buildMsgRow(msg, unreadFrom === i ? null : messages[i - 1]));
  });
  window._unreadBefore = 0;
  setTimeout(() => list.classList.remove('bulk'), 60);
}

function appendMessageToChat(msg) {
  const list = _el('msg-list');
  if (!list) return;
  const mine = msg.from === currentUser.username;
  const near = list.scrollHeight - list.scrollTop - list.clientHeight < 140;
  const day = formatDay(msg.ts);
  const divs = list.querySelectorAll('.msg-day-divider');
  if (!divs.length || divs[divs.length - 1].textContent !== day) {
    const d = document.createElement('div');
    d.className = 'msg-day-divider'; d.innerHTML = `<span>${day}</span>`;
    list.appendChild(d);
  }
  const i = messages.indexOf(msg);
  list.appendChild(buildMsgRow(msg, i > 0 ? messages[i - 1] : null));
  if (mine || near) scrollMsgsToBottom(true);
  else { _newCount++; setFab(true); }
}

// ─── ответ на сообщение ───────────────────────────────────────
function startDmReply(msg) {
  if (isTemp(msg)) return toast('Сообщение ещё отправляется', 'error');
  _replyToMsg = { id: msg.id, from: msg.from, text: msg.text };
  const bar = _el('reply-preview-bar');
  if (bar) {
    bar.classList.add('on');
    bar.innerHTML = `<div class="reply-bar-body"><b>${escapeHtml(msg.from)}</b><span>${escapeHtml(msg.text.slice(0, 90))}</span></div>
      <button type="button" id="reply-preview-cancel" title="Отменить (Esc)">✕</button>`;
    _el('reply-preview-cancel').onclick = cancelDmReply;
  }
  _el('dm-input')?.focus();
}
function cancelDmReply() {
  _replyToMsg = null;
  const bar = _el('reply-preview-bar');
  if (bar) { bar.classList.remove('on'); bar.innerHTML = ''; }
}

// ─── скролл + кнопка «вниз» со счётчиком новых ────────────────
function scrollMsgsToBottom(smooth) {
  requestAnimationFrame(() => {
    const l = _el('msg-list');
    if (l) l.scrollTo({ top: l.scrollHeight, behavior: smooth === true ? 'smooth' : 'auto' });
  });
  _newCount = 0; setFab(false);
}
function onMsgScroll() {
  const l = _el('msg-list'); if (!l) return;
  const far = l.scrollHeight - l.scrollTop - l.clientHeight > 240;
  if (!far) _newCount = 0;
  setFab(far);
}
function setFab(show) {
  const b = _el('to-bottom'); if (!b) return;
  b.hidden = !show;
  _el('to-bottom-n').textContent = _newCount || '';
}

// ─── POLLING (запасной канал, если сокет недоступен) ──────────
let lastPollTs = null;
async function pollMessages(partner) {
  if (!currentUser || activePartner !== partner) return;
  try {
    const data = await apiGet('/dm/messages/' + encodeURIComponent(partner));
    (data.messages || []).forEach(m => {
      const known = messages.find(k => k.id === m.id);
      if (known) {
        if (m.read && !known.read && known.from === currentUser.username) { known.read = true; repaintMsg(known); }
      } else {
        messages.push(m);
        appendMessageToChat(m);
        if (m.from !== currentUser.username) markRead(partner);
      }
    });
  } catch {}
}

// ─── SEND DM ──────────────────────────────────────────────────
const _dmSendTimes = [];
function dmRateLimitOk() {
  const now = Date.now();
  while (_dmSendTimes.length && now - _dmSendTimes[0] > 1000) _dmSendTimes.shift();
  if (_dmSendTimes.length >= 2) return false;
  _dmSendTimes.push(now);
  return true;
}

async function sendDm(retry) {
  const input = _el('dm-input');
  const partner = activePartner;
  if (!input || !partner || isSystemPartner(partner)) return;
  const isRetry = !!(retry && retry.id);
  const text = isRetry ? retry.text : input.value.trim();
  if (!text) return;
  if (!dmRateLimitOk()) return toast('Не так быстро — максимум 2 сообщения в секунду', 'error');

  let reply = _replyToMsg;
  if (isRetry) {
    reply = retry.replyTo || null;
    messages.splice(messages.indexOf(retry), 1);
    _el('msg-' + retry.id)?.remove();
  } else {
    input.value = ''; input.style.height = ''; onDmInput(input);
    try { localStorage.removeItem('dm_draft_' + partner); } catch {}
  }
  cancelDmReply();

  // Оптимистичный рендер — теперь СРАЗУ вместе с цитатой ответа
  const tempMsg = {
    id: 'temp_' + Date.now(), from: currentUser.username, to: partner, text,
    ts: new Date().toISOString(), read: false, _state: 'sending',
    replyTo: reply ? { id: reply.id, from: reply.from, text: reply.text } : undefined
  };
  messages.push(tempMsg);
  appendMessageToChat(tempMsg);
  updateConvLastMsg(partner, text, tempMsg.ts, false);

  try {
    const msg = await apiPost('/dm/send', { to: partner, text, replyTo: reply?.id || undefined });
    // сокет/поллинг могли успеть добавить это же сообщение — убираем дубль
    const dup = messages.findIndex(m => m !== tempMsg && m.id === msg.id);
    if (dup !== -1) { messages.splice(dup, 1); _el('msg-' + msg.id)?.remove(); }
    const oldId = tempMsg.id;
    Object.assign(tempMsg, msg, { replyTo: (msg.replyTo && typeof msg.replyTo === 'object') ? msg.replyTo : tempMsg.replyTo });
    delete tempMsg._state;
    const el = _el('msg-' + oldId);
    if (el) { el.id = 'msg-' + tempMsg.id; paintStatus(el, tempMsg); }
  } catch (e) {
    toast(e.message || 'Ошибка отправки', 'error');
    tempMsg._state = 'failed';
    repaintMsg(tempMsg);
  } finally {
    _el('dm-input')?.focus();
  }
}

// ─── ввод: счётчик, «печатает…», черновики ───────────────────
let _typingSentAt = 0, _typingTimer;
function onDmInput(el) {

  if (c) { c.textContent = n > 400 ? n + '/500' : ''; c.classList.toggle('warn', n >= 480); }

}
function refreshStatus() {
  const el = document.querySelector('.chat-user-status');

}
function showTyping() {

  el.innerHTML = '<span class="typing-txt">печатает<i>.</i><i>.</i><i>.</i></span>';
  el.className = 'chat-user-status chat-online-status';

}
function saveDraft() {
  const t = _el('dm-input'); if (!t || !activePartner) return;
  try { t.value.trim() ? localStorage.setItem('dm_draft_' + activePartner, t.value) : localStorage.removeItem('dm_draft_' + activePartner); } catch {}
}
function restoreDraft(p) {
  const t = _el('dm-input'); if (!t) return;
  try { const d = localStorage.getItem('dm_draft_' + p); if (d) { t.value = d; autoResize(t); onDmInput(t); } } catch {}
}
window.addEventListener('beforeunload', saveDraft);

// ─── эмодзи ──────────────────────────────────────────────────
const EMOJI = ['😀','😂','🥹','😍','😎','🤔','😅','😭','😡','👍','👎','👏','🙏','🔥','💯','🎉','❤️','💔','👀','🤝','💪','🧠','⭐','✅','❌','♟️','♞','♝','♜','♛','♚','🏆','🥇','⏱️','⚡','😴','🤯','😬','🫡','🤦'];
function toggleEmoji(e) {
  e?.stopPropagation();
  const p = _el('emoji-pop'); if (!p) return;
  if (!p.dataset.ready) {
    p.innerHTML = EMOJI.map(x => `<button type="button" onclick="insertEmoji('${x}')">${x}</button>`).join('');
    p.dataset.ready = 1;
  }
  p.hidden = !p.hidden;
}
function insertEmoji(x) {
  const t = _el('dm-input'); if (!t || t.value.length + x.length > 500) return;
  const s = t.selectionStart ?? t.value.length, e = t.selectionEnd ?? s;
  t.value = t.value.slice(0, s) + x + t.value.slice(e);
  t.selectionStart = t.selectionEnd = s + x.length;

}
document.addEventListener('click', e => {
  if (!e.target.closest('#emoji-pop') && !e.target.closest('#emoji-btn')) { const p = _el('emoji-pop'); if (p) p.hidden = true; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { cancelDmReply(); const p = _el('emoji-pop'); if (p) p.hidden = true; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); _el('conv-search')?.focus(); }
});

// ─── звук и заголовок вкладки ────────────────────────────────
let _ac;
const soundOn = () => { try { return localStorage.getItem('dm_sound') !== 'off'; } catch { return true; } };
function toggleSound() {
  try { localStorage.setItem('dm_sound', soundOn() ? 'off' : 'on'); } catch {}
  const b = _el('sound-btn'); if (b) b.textContent = soundOn() ? '🔔' : '🔕';
  if (soundOn()) playPing();
}
function playPing() {
  if (!soundOn()) return;
  try {
    _ac = _ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = _ac.currentTime;
    [[880, 0], [1175, .09]].forEach(([f, d]) => {
      const o = _ac.createOscillator(), g = _ac.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t + d);
      g.gain.exponentialRampToValueAtTime(.08, t + d + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + d + .25);
      o.connect(g); g.connect(_ac.destination); o.start(t + d); o.stop(t + d + .26);
    });
  } catch {}
}
function updateTabTitle() {
  const n = conversations.reduce((s, c) => s + (c.unread || 0), 0);
  document.title = (n ? `(${n}) ` : '') + 'Личные сообщения — Chess Home';
}

function dmInputKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendDm();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ─── MARK READ ────────────────────────────────────────────────
async function markRead(partner) {
  try { await apiPost('/dm/read', { partner }); } catch {}
}

// ─── BLOCK / UNBLOCK ──────────────────────────────────────────
let blockTarget = null;

function confirmBlock(username) {
  blockTarget = username;
  const conv = conversations.find(c => c.partner === username);
  const isBlocked = conv?.blocked;

  if (isBlocked) {
    unblockUser(username);
    return;
  }

  document.getElementById('block-modal-title').textContent = 'Заблокировать ' + username + '?';
  document.getElementById('block-modal-text').textContent =
    username + ' не сможет отправлять вам сообщения.';
  document.getElementById('block-modal-confirm').textContent = '🚫 Заблокировать';
  document.getElementById('block-modal-confirm').onclick = () => blockUser(username);
  document.getElementById('block-modal').classList.add('open');
}

function closeBlockModal() {
  document.getElementById('block-modal').classList.remove('open');
  blockTarget = null;
}

async function blockUser(username) {
  closeBlockModal();
  try {
    await apiPost('/dm/block', { username });
    toast(username + ' заблокирован', 'success');
    const c = conversations.find(c => c.partner === username);
    if (c) c.blocked = true;
    if (activePartner === username) openConversation(username);
    else renderConvList();
  } catch (e) { toast(e.message, 'error'); }
}

async function unblockUser(username) {
  try {
    await apiPost('/dm/unblock', { username });
    toast(username + ' разблокирован', 'success');
    const c = conversations.find(c => c.partner === username);
    if (c) c.blocked = false;
    if (activePartner === username) openConversation(username);
    else renderConvList();
  } catch (e) { toast(e.message, 'error'); }
}

// ─── MOBILE BACK ──────────────────────────────────────────────
function mobileBack() {
  saveDraft();
  activePartner = null;
  clearInterval(pollingTimer);
  document.getElementById('inbox-sidebar')?.classList.add('visible');
  document.getElementById('inbox-chat')?.classList.remove('visible');
  document.getElementById('inbox-chat').innerHTML = '';
  renderConvList();
}

// ─── OPEN FROM URL ────────────────────────────────────────────
function handleUrlRoute() {
  // /inbox           → show list
  // /inbox/username  → open conversation with username
  const path = location.pathname;
  const match = path.match(/^\/inbox\/(.+)$/);
  if (match) {
    const partner = decodeURIComponent(match[1]);
    // Wait for conversations to load, then open
    const tryOpen = () => {
      if (currentUser && partner !== currentUser.username) {
        openConversation(partner);
      } else if (!currentUser) {
        setTimeout(tryOpen, 200);
      }
    };
    setTimeout(tryOpen, 400);
  }
}

// ─── NOT LOGGED ───────────────────────────────────────────────
function renderNotLogged() {
  document.getElementById('inbox-list').innerHTML =
    `<div class="inbox-empty-state"><div class="empty-icon">${LOCK_ICON}</div><p>Войдите, чтобы видеть переписки</p></div>`;

  document.getElementById('inbox-chat').innerHTML = `
    <div class="not-logged-screen">
      <div class="nl-icon">${MAIL_ICON_XL}</div>
      <h3>Личные сообщения</h3>
      <p>Чтобы переписываться с игроками, необходимо войти в аккаунт.</p>
      <a href="/" class="btn btn-primary">Войти</a>
    </div>`;
}

// ─── ONLINE POLLING ───────────────────────────────────────────
async function pollOnline() {
  try {
    const d = await apiGet('/online/users');
    onlineUsers = new Set(d.map(u => u.username));
    const el = document.getElementById('online-count');
    if (el) el.textContent = onlineUsers.size;
    renderConvList();
    // update status in open chat
    if (activePartner) {
      const statusEl = document.querySelector('.chat-user-status');
      if (statusEl) {
        const online = onlineUsers.has(activePartner);
        statusEl.textContent = online ? '● онлайн' : 'не в сети';
        statusEl.className = 'chat-user-status' + (online ? ' chat-online-status' : '');
      }
    }
  } catch {}
}

// ─── CONV LIST POLLING ────────────────────────────────────────
async function pollConversations() {
  if (!currentUser) return;
  try {
    const data = await apiGet('/dm/conversations');
    const old = JSON.stringify(conversations.map(c => ({ p: c.partner, u: c.unread, t: c.lastTs })));
    const fresh = JSON.stringify(data.map(c => ({ p: c.partner, u: c.unread, t: c.lastTs })));
    if (old !== fresh) {
      // Check for new unread messages to show notification
      data.forEach(newC => {
        const old = conversations.find(c => c.partner === newC.partner);
        if (newC.unread > (old?.unread || 0) && newC.partner !== activePartner) {
          showDmNotif(newC.partner, newC.lastMsg || 'Новое сообщение');
        }
      });
      conversations = data;
      renderConvList();
    }
  } catch {}
}

// ─── INIT ──────────────────────────────────────────────────────
async function init() {
  CH.initHeader();
  // CH will be updated after auth resolves

  // Auto-login: сервер сам читает токен из HttpOnly-cookie.
  try {
    currentUser = await apiGet('/me');
    CH.setCurrentUser(currentUser);
    CH.setActivePage('inbox');
  } catch (e) {
    currentUser = null;
  }

  updateAuthUI();

  if (currentUser) {
    connectSocket();
    await loadConversations();
    handleUrlRoute();

    setInterval(() => { if (!document.hidden) pollOnline(); }, 8000);
    setInterval(() => { if (!document.hidden) pollConversations(); }, 5000);
    pollOnline();
  } else {
    renderNotLogged();
  }
}

document.addEventListener('DOMContentLoaded', init);

// ─── WRITE_TO_USER  (called from other pages via URL) ─────────
window.openDMWith = function(username) {
  if (!currentUser) { window.location = '/'; return; }
  if (username === currentUser.username) { toast('Нельзя писать самому себе', 'error'); return; }
  window.location = '/inbox/' + encodeURIComponent(username);
};
function checkAndInsertBotText() {
  const urlParams = new URLSearchParams(window.location.search);
  const textFromUrl = urlParams.get('input');

  if (textFromUrl) {
    // Находим именно вашу textarea по ID
    const textarea = document.getElementById('dm-input');
    
    if (textarea) {
      // 2. Вставляем текст внутрь textarea двумя способами для надежности
      textarea.value = textFromUrl;
      textarea.innerText = textFromUrl;

      // 3. У вас на элементе висит oninput="autoResize(this)". 
      // Вызываем её вручную, чтобы поле увеличилось по высоте под текст вопроса
      if (typeof autoResize === 'function') {
        autoResize(textarea);
      }

      // 4. Искусственно пинаем события, чтобы кнопка отправки активировалась
      textarea.dispatchEvent(new Event('input', { bubbles: true }));
      textarea.focus();
      
      return true; // Успешно вставили
    }
  }
  return false;
}

// Запускаем проверку каждые 100 миллисекунд, пока элемент не появится в DOM
const insertInterval = setInterval(() => {
  if (checkAndInsertBotText()) {
    clearInterval(insertInterval); // Как только вставили — останавливаем таймер
  }
}, 100);

// На всякий случай ограничиваем работу таймера (например, 5 секунд), если инпута вообще нет на странице
setTimeout(() => clearInterval(insertInterval), 5000);


</script>
